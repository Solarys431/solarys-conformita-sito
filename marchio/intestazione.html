<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Intestazione</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0d0f13;
       font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}

  /* ── intestazione ─────────────────────────────────────────── */
  .testata{
    position:relative; width:1280px; height:400px; overflow:hidden;
    background:
      radial-gradient(1100px 380px at 78% 8%, rgba(252,176,60,.16), transparent 62%),
      radial-gradient(700px 300px at 8% 100%, rgba(226,88,70,.10), transparent 60%),
      #14181f;
    display:flex; align-items:center; padding:0 76px;
  }
  /* la trama a blocchi del marchio, appena percettibile */
  .testata::after{
    content:""; position:absolute; inset:0; opacity:.055; pointer-events:none;
    background-image:linear-gradient(#fcb03c 1px, transparent 1px),
                     linear-gradient(90deg, #fcb03c 1px, transparent 1px);
    background-size:12px 12px;
    mask-image:linear-gradient(105deg, transparent 45%, #000 100%);
  }

  .contenuto{position:relative; z-index:2; display:flex; align-items:center; gap:44px}

  .marchio{width:132px; height:132px; flex:none; color:#eae7e1;
           filter:drop-shadow(0 14px 34px rgba(226,88,70,.34))}

  .parole{display:flex; flex-direction:column; gap:16px}
  .occhiello{
    font:600 12px/1 ui-monospace,monospace; letter-spacing:.32em;
    text-transform:uppercase; color:#c9922a;
  }
  .nome{display:flex; align-items:baseline; gap:16px}
  .nome svg{height:40px; width:auto; filter:drop-shadow(0 3px 12px rgba(240,150,40,.3))}
  .nome b{
    font:600 40px/1 ui-monospace,monospace; letter-spacing:.16em;
    color:#eae7e1; text-transform:uppercase; padding-bottom:2px;
  }
  .claim{
    font-size:25px; line-height:1.35; color:#a9b0bc; max-width:30ch;
  }
  .claim i{font-style:normal; color:#eae7e1; font-weight:600}
  .filo{
    margin-top:6px; width:120px; height:3px; border-radius:2px;
    background:linear-gradient(90deg,#fcb03c,#e25846);
  }
</style></head><body>

<div class="testata">
  <div class="contenuto">
    <!-- il marchio -->
    <svg class="marchio" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="s" x1="0" y1="0" x2="0.35" y2="1">
          <stop offset="0" stop-color="#fcb03c"/><stop offset="1" stop-color="#e25846"/>
        </linearGradient>
      </defs>
      <rect x="11" y="10" width="54" height="76" rx="5" fill="none"
            stroke="currentColor" stroke-width="6" stroke-opacity=".9"/>
      <g fill="currentColor" opacity=".28">
        <rect x="24" y="26" width="30" height="6" rx="3"/>
        <rect x="24" y="66" width="22" height="6" rx="3"/>
      </g>
      <rect x="24" y="44" width="34" height="8" rx="4" fill="url(#s)"/>
      <path d="M45 63 L59 77 L89 33" fill="none" stroke="url(#s)"
            stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <div class="parole">
      <div class="occhiello">Analisi di conformità documentale</div>
      <div class="nome">
        <!-- il logotipo a blocchi, quello che il prodotto usa già -->
        <svg viewBox="0 0 288 30" xmlns="http://www.w3.org/2000/svg" aria-label="Solarys"><rect x="0" y="0" width="36" height="6" fill="#ffd666"/><rect x="42" y="0" width="36" height="6" fill="#ffd666"/><rect x="84" y="0" width="12" height="6" fill="#ffd666"/><rect x="126" y="0" width="36" height="6" fill="#ffd666"/><rect x="168" y="0" width="36" height="6" fill="#ffd666"/><rect x="210" y="0" width="12" height="6" fill="#ffd666"/><rect x="234" y="0" width="12" height="6" fill="#ffd666"/><rect x="252" y="0" width="36" height="6" fill="#ffd666"/><rect x="0" y="6" width="12" height="6" fill="#fcb03c"/><rect x="42" y="6" width="12" height="6" fill="#fcb03c"/><rect x="66" y="6" width="12" height="6" fill="#fcb03c"/><rect x="84" y="6" width="12" height="6" fill="#fcb03c"/><rect x="126" y="6" width="12" height="6" fill="#fcb03c"/><rect x="150" y="6" width="12" height="6" fill="#fcb03c"/><rect x="168" y="6" width="12" height="6" fill="#fcb03c"/><rect x="192" y="6" width="12" height="6" fill="#fcb03c"/><rect x="210" y="6" width="12" height="6" fill="#fcb03c"/><rect x="234" y="6" width="12" height="6" fill="#fcb03c"/><rect x="252" y="6" width="12" height="6" fill="#fcb03c"/><rect x="0" y="12" width="36" height="6" fill="#f78c1e"/><rect x="42" y="12" width="12" height="6" fill="#f78c1e"/><rect x="66" y="12" width="12" height="6" fill="#f78c1e"/><rect x="84" y="12" width="12" height="6" fill="#f78c1e"/><rect x="126" y="12" width="36" height="6" fill="#f78c1e"/><rect x="168" y="12" width="30" height="6" fill="#f78c1e"/><rect x="216" y="12" width="24" height="6" fill="#f78c1e"/><rect x="252" y="12" width="36" height="6" fill="#f78c1e"/><rect x="24" y="18" width="12" height="6" fill="#ee6c33"/><rect x="42" y="18" width="12" height="6" fill="#ee6c33"/><rect x="66" y="18" width="12" height="6" fill="#ee6c33"/><rect x="84" y="18" width="12" height="6" fill="#ee6c33"/><rect x="126" y="18" width="12" height="6" fill="#ee6c33"/><rect x="150" y="18" width="12" height="6" fill="#ee6c33"/><rect x="168" y="18" width="12" height="6" fill="#ee6c33"/><rect x="192" y="18" width="12" height="6" fill="#ee6c33"/><rect x="222" y="18" width="12" height="6" fill="#ee6c33"/><rect x="276" y="18" width="12" height="6" fill="#ee6c33"/><rect x="0" y="24" width="36" height="6" fill="#e25846"/><rect x="42" y="24" width="36" height="6" fill="#e25846"/><rect x="84" y="24" width="36" height="6" fill="#e25846"/><rect x="126" y="24" width="12" height="6" fill="#e25846"/><rect x="150" y="24" width="12" height="6" fill="#e25846"/><rect x="168" y="24" width="12" height="6" fill="#e25846"/><rect x="192" y="24" width="12" height="6" fill="#e25846"/><rect x="222" y="24" width="12" height="6" fill="#e25846"/><rect x="252" y="24" width="36" height="6" fill="#e25846"/></svg>
        <b>Conformità</b>
      </div>
      <div class="filo"></div>
      <div class="claim">Non un parere: <i>un riscontro</i>.<br>
        Ogni verdetto porta la citazione che lo prova.</div>
    </div>
  </div>
</div>

</body></html>
